<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meme Robinhood City</title>
<meta name="description" content="A night drive down the main street of the city where every meme lives" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1f1a14; --cream:#fbf5e6; --lime:#b6e83c; --pink:#ff5fa8; --night:#0d1f1c; --dim:#8a7a66;
  --disp:"Bungee",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.6vw,34px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.key{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .14s,box-shadow .14s}
.key:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.lime{background:var(--lime)}
.key.pink{background:var(--pink)}
.key svg{width:14px;height:14px}
.key img{width:24px;height:24px;border:2px solid var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ================= THE CITY (fixed 3D world) ================= */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--night);perspective:900px;perspective-origin:50% 52%}
.plate{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:50% 50%;will-change:transform}
.space{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.obj{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform,opacity;backface-visibility:hidden}
.obj img{width:var(--w);max-width:none;transform:translate(-50%,-100%);filter:drop-shadow(0 30px 24px rgba(0,0,0,.55))}
.obj.neon img{animation:neon 2.2s steps(3,end) infinite}
@keyframes neon{0%,100%{filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) brightness(1)}40%{filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) brightness(1.25)}55%{filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) brightness(.8)}}
.obj.lamp img{animation:lampglow 3s ease-in-out infinite}
@keyframes lampglow{0%,100%{filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) drop-shadow(0 -10px 26px rgba(255,190,90,.35))}50%{filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) drop-shadow(0 -10px 40px rgba(255,190,90,.6))}}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(13,31,28,0) 30%,rgba(13,31,28,.55) 80%,rgba(13,31,28,.95) 100%)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.45;mix-blend-mode:multiply}
.rain{position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:repeating-linear-gradient(100deg,transparent 0 7px,rgba(255,255,255,.08) 7px 8px,transparent 8px 15px);animation:rainfall .6s linear infinite}
@keyframes rainfall{from{background-position:0 0}to{background-position:-40px 90px}}

/* HUD */
.hud{position:fixed;z-index:9}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad);display:flex;gap:8px}
.mark{position:fixed;left:var(--pad);bottom:var(--pad);z-index:9;font-family:var(--disp);font-size:clamp(24px,3.6vw,50px);line-height:.95;color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);pointer-events:none;transition:opacity .4s}
.mark em{font-style:normal;color:var(--lime)}
.mark.off{opacity:0}
.prog{position:fixed;right:var(--pad);bottom:var(--pad);z-index:9;width:min(180px,30vw);height:10px;background:var(--cream);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.prog i{display:block;height:100%;width:0;background:var(--lime)}

/* scroll runway */
.runway{position:relative;z-index:1;height:calc(var(--len) + 100svh);pointer-events:none}

/* ================= PANEL ================= */
.panel{position:relative;z-index:2;background:var(--cream);border-top:4px solid var(--ink);padding:clamp(28px,5vw,60px) var(--pad)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(1120px,100%);margin:0 auto}
.tile{background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 8px 10px;text-align:center;transition:transform .14s,box-shadow .14s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile img{height:110px;width:auto;margin:0 auto 8px;object-fit:contain}
.tile b{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.04em}
.sign{width:min(600px,100%);margin:clamp(24px,4vw,44px) auto 0;background:#fff;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;display:grid;gap:12px;justify-items:center}
.ca{display:grid;justify-items:center;gap:8px;width:100%;padding:14px 16px;background:var(--ink);color:var(--cream);cursor:pointer}
.ca .tag{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--pink)}
.ca .ca-val{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--lime);white-space:nowrap;max-width:100%;line-height:1.2}
.ca.live .ca-val{font-size:clamp(10px,2.4vw,15px);letter-spacing:.02em}
.ca .cp{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--cream);padding:6px 12px;border:2px dashed rgba(251,245,230,.5)}
.ca.live{box-shadow:0 0 0 3px var(--lime),0 0 30px rgba(182,232,60,.55)}
.ca.live .cp{border-style:solid;border-color:var(--lime);color:var(--lime)}
.sign .btns{justify-content:center}
.end{width:min(1120px,100%);margin:24px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--disp);font-size:9px;letter-spacing:.08em;color:var(--dim)}

@media (max-width:820px){
  .tr .key span{display:none}
  .tr .key{padding:0 11px}
  .tl .key span{display:none}
  .mark{font-size:24px;bottom:calc(var(--pad) + 26px)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile img{height:80px}
  .ca .ca-val{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="world" id="world">
  <img class="plate" id="plate" src="assets/plate.webp" alt="" />
  <div class="space" id="space"></div>
  <div class="fog"></div><div class="rain"></div><div class="scan"></div>
</div>

<a class="hud tl key" href="/"><img src="assets/favicon.png" alt="" /><span data-name>MEME ROBINHOOD CITY</span></a>
<nav class="hud tr">
  <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>BUY</span><svg><use href="#i-pons"/></svg></a>
  <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
  <a class="key pink" href="/docs"><span>DOCS</span></a>
</nav>
<div class="mark" id="mark">MEME<br /><em>ROBINHOOD</em><br />CITY</div>
<div class="prog"><i id="prog"></i></div>

<div class="runway" id="runway"></div>

<section class="panel" id="panel">
  <div class="tiles" id="tiles"></div>
  <div class="sign">
    <div class="ca" id="ca"><span class="tag">CONTRACT</span><b class="ca-val" id="caVal">soon</b><button class="cp" id="caCopy">[ COPY ]</button></div>
    <div class="btns">
      <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad">BUY ON PONS<svg><use href="#i-pons"/></svg></a>
      <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
      <a class="key pink" href="/docs">DOCS</a>
    </div>
  </div>
  <div class="end"><span data-name>MEME ROBINHOOD CITY</span><span>ROBINHOOD CHAIN · PONS</span></div>
</section>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME.toUpperCase(); });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = '[ COPIED ]'; } else { caCopy.textContent = '[ NOT YET ]'; } setTimeout(function(){ caCopy.textContent = old; }, 1400); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .3; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  /* ---- the street ---- */
  var mobile = innerWidth < 820;
  var STEP = 1500, GROUND = 300, SIDE = mobile ? 460 : 760, START = 2400;
  var blocks = [
    ['b-doge', 'Doge Tower', 'L', 1.55], ['b-pepe', 'Pepe Bank', 'R', 1.5], ['b-troll', 'Troll Arcade', 'L', 1.2, 'neon'], ['b-wojak', 'Wojak Apartments', 'R', 1.5],
    ['b-cheems', 'Cheems Diner', 'L', 1.35], ['b-chad', 'Chad Gym', 'R', 1.5], ['b-nyan', 'Nyan Cinema', 'L', 1.5], ['b-grumpy', 'Grumpy Post Office', 'R', 1.5]
  ];
  var space = document.getElementById('space'), objs = [], tiles = document.getElementById('tiles');
  function add(src, x, z, w, cls){ var d = document.createElement('div'); d.className = 'obj' + (cls ? ' ' + cls : ''); d.style.setProperty('--w', w + 'px'); d.innerHTML = '<img src="assets/' + src + '.webp" alt="" />'; space.appendChild(d); objs.push({ el: d, x: x, z: z }); }
  blocks.forEach(function(b, i){
    var z = START + i * STEP, x = (b[2] === 'L' ? -SIDE : SIDE) + (Math.random() - .5) * 80; add(b[0], x, z, 440 * b[3], b[4]);
    add('lamp', (b[2] === 'L' ? SIDE : -SIDE) * .55, z + STEP * .5, 260, 'lamp');
    var t = document.createElement('div'); t.className = 'tile'; t.innerHTML = '<img src="assets/' + b[0] + '.webp" alt="" /><b>' + b[1] + '</b>'; tiles.appendChild(t);
  });
  var END = START + blocks.length * STEP + 900; add('statue', 0, END, 620);
  var LEN = END + 200; document.documentElement.style.setProperty('--len', LEN + 'px');

  var dbg = +(new URLSearchParams(location.search).get('cam')) || 0, cam = dbg, target = dbg, plate = document.getElementById('plate'), mark = document.getElementById('mark'), prog = document.getElementById('prog'), t0 = performance.now();
  function frame(now){
    target = Math.min(LEN, (window.scrollY || 0) + dbg); cam += (target - cam) * .09;
    var sway = Math.sin((now - t0) / 1400) * 10, bob = Math.sin((now - t0) / 900) * 4;
    space.style.transform = 'translate3d(' + (-sway) + 'px,' + bob + 'px,0)';
    plate.style.transform = 'translate(' + (-sway * .3) + 'px,' + (bob * .3) + 'px) scale(' + (1 + Math.min(.35, cam / LEN * .35)) + ')';
    objs.forEach(function(o){ var dz = o.z - cam; if(dz < -400 || dz > 9000){ o.el.style.display = 'none'; return; } o.el.style.display = ''; var fog = Math.max(0, Math.min(1, 1 - (dz - 800) / 6500)); o.el.style.opacity = fog; o.el.style.transform = 'translate3d(' + o.x + 'px,' + GROUND + 'px,' + (-dz) + 'px)'; });
    mark.classList.toggle('off', cam > STEP * .8); prog.style.width = Math.round(cam / LEN * 100) + '%';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__mrc = { len: LEN };
})();
</script>
</body>
</html>
